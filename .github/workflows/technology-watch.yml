name: Technology release watch

on:
  pull_request:
    paths:
      - '.github/**'
      - '.agents/skills/**'
      - 'docs/reef-setup.md'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - '.agents/skills/**'
      - 'docs/reef-setup.md'
  schedule:
    # Monday 10:17 UTC is before 06:00 in America/Chicago year-round.
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technology-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  skill-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the seven contributor skill packages
        shell: bash
        run: |
          node --version
          node --test .agents/skills/*/tests/validate-skill.test.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release detection and issue ownership
        run: python3 -B -m unittest discover -s .github/scripts/tests -v

  watch:
    if: github.event_name != 'pull_request'
    needs: [validate, skill-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check stable releases and maintain one review issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/scripts/technology_watch.py --output-dir "$RUNNER_TEMP/shoal-technology-watch" --update-issue
      - name: Retain the dated source report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shoal-technology-watch
          path: ${{ runner.temp }}/shoal-technology-watch/
          if-no-files-found: error
          retention-days: 14
